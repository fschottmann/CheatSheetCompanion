[GlobalShortcut]
#to display all possible keys check  [System.Windows.Forms.Keys]
#also keep in mind the shortcuts from the other active programs
AutoSwitch = ControlKey,ShiftKey,F2
DisplayCompanion = ControlKey,ShiftKey,F11

[Configuration]
MarkDownFolder = C:\PATH\TO\MarkDownFolder
#adjust the vault value to retrieve your vault
SourceLink = obsidian://open?vault=VAULTFOLDER&file={0}