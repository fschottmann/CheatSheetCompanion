[GlobalShortcut]
; Key names from [System.Windows.Forms.Keys]; modifiers: ControlKey, ShiftKey, Alt (Menu), LWin. Empty = no hotkey.
AutoSwitch = ControlKey,ShiftKey,F2
DisplayCompanion = ControlKey,ShiftKey,F11
ClipboardSwitch = ControlKey,ShiftKey,F3
Search =
; One-shot lookup of the current clipboard text (independent of the Clip switch), e.g. ControlKey,ShiftKey,F4
ClipboardLookup =

[Configuration]
; Default vault: absolute path or relative to the script folder (vault name = folder name). More vaults under [Vaults].
; The bundled demo vault shows every feature and contains the help note ("Help").
MarkDownFolder = vault
; Editor link: {0} = note path without .md (URL encoded), {1} = vault name. Empty = default program for .md files.
SourceLink = obsidian://open?vault={1}&file={0}
; Subfolder (relative to the vault) for new notes, empty = vault root
NewNoteFolder = Inbox
; Template for new notes (relative to the vault). Placeholders: {{title}}, {{date}}, {{time}}, {{content}}; Templater dates are replaced.
NewNoteTemplate = _templates\note.md
; Maximum length of the proposed note name
NewNoteNameMaxChars = 60
; Folders whose notes are not indexed (.obsidian, .trash and .git are always skipped), comma separated: a plain name matches
; that folder at any depth, a relative path like "archive\old notes" matches exactly that folder and everything below it.
; Images and other attachments in those folders stay available for embeds.
; Personal settings (your vault path, language ...) belong in ini\config.local.ini: same keys, overrides this file, not in git.
IgnoreFolders = _templates

; Sources at start-up (afterwards taken from the saved state)
FollowWindow = true
FollowClipboard = false
AutoCopy = false

; UI language: auto (Windows display language), de, en or a code with its own file lang\<code>.ini (template: lang\de.ini)
Language = auto
; Theme: auto (follows Windows), light, dark or a file name from themes\ (e.g. github). Saved when chosen in the context menu.
Theme = auto
; Show YAML front matter as a collapsible box
ShowFrontmatter = false
; Double click in the text opens the note in the editor: ctrl (only with Ctrl), always, off
EditOnDoubleClick = ctrl
; No match: keep = the shown note stays (status line only), suggest = page "No note for this yet" with similar notes
NoMatchBehavior = keep
; Recently shown notes on the start page (0 = off)
RecentNotes = 8
; Match reason in the status line and as tab tooltip (name in text, similar word, alias, rule)
ShowMatchReason = true
; Folders (relative to the vault, comma separated) whose notes are never matched automatically but stay searchable.
; Single notes: front matter "csc: ignore"
MatchIgnoreFolders = Daily
; Remember copied texts (code block button, selection, context menu): count, 0 = off. "COPIED" handle at the right edge, one click copies again.
CopyHistory = 10
; "LINKED" handle at the right edge: notes linking to the shown note with the line of the mention (like Obsidian)
ShowBacklinks = true
; Hovering an internal link shows the target note in a popup (false = off)
LinkPreview = true
; Window opacity (0.3 to 1)
WindowOpacity = 0.92
; Opacity while another program is active (0 = off). Full opacity under the mouse, when collapsed and while the search is open.
InactiveOpacity = 0.6

; Matching
SimilarityThreshold = 0.25
SimilarityThresholdTitle = 0.25
SimilarityThresholdProcess = 0.25
SimilarityThresholdClipboard = 0.4
; Process name hits are multiplied by this (0.1 to 1): the note named in the window title must beat a note that merely contains the process name
ProcessWeight = 0.9
MaxCandidates = 5
NGram = 3
PollIntervalMs = 500
ClipboardMaxChars = 400
SearchMaxResults = 12
; false = drop note texts after indexing (search by name and alias only, saves memory with very large vaults)
SearchContent = true

; Auto Copy: minimum hold time of the mouse button in ms (0 = immediately)
AutoCopyMinHoldMs = 150

; Rendering: true = single line breaks are ignored (like "Strict line breaks" in Obsidian)
StrictLineBreaks = false

; Debug = true writes a detailed log to %LocalAppData%\CheatSheetCompanion\csc.log and enables DevTools
Debug = false

[Vaults]
; More vaults: Name = path (absolute or relative to the script folder; the name should equal the Obsidian vault name). Switch with right click > Vault.
; work = D:\obsidian\work

[Rules]
; Fixed assignment program -> note (always shown first, score 1.00). Left: process name (without .exe)
; or "title:" + regular expression on the window title. Right: note name or path in the vault (without .md).
; Examples for the demo vault:
; mstsc = Remote Desktop
; title:.*Visual Studio Code$ = Visual Studio Code
